    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34291f"/><stop offset="1" stop-color="#15100c"/></linearGradient>
    <radialGradient id="arc" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e2a56f" stop-opacity=".45"/><stop offset=".55" stop-color="#e2a56f" stop-opacity=".1"/><stop offset="1" stop-color="#e2a56f" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#ffe1be" stroke-opacity=".14" stroke-width="4"/>
  <circle cx="128" cy="128" r="86" fill="url(#arc)"/>
  <path fill="#f5ebdf" d="M31 40h36l48 88-48 88H31l48-88z"/>

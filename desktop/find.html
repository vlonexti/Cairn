<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Find</title>
  <style>
    :root { --bg: #2e2722; --line: #4d4038; --ink: #f2e8dc; --muted: #ab9b8c; --hover: #3a3029; --field: #1a1613; }
    html.light { --bg: #fffbf6; --line: #cfbba6; --ink: #2a1f18; --muted: #6c5a4d; --hover: #f4ebe0; --field: #f7f0e7; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { font: 13px/1 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); }
    .bar { height: 100%; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    input { flex: 1; min-width: 0; height: 30px; padding: 0 9px; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; outline: none; }
    input:focus { border-color: var(--muted); }
    .count { min-width: 62px; padding: 0 6px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .count.none { color: #f07a6e; }
    button { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--muted); cursor: pointer; }
    button:hover { background: var(--hover); color: var(--ink); }
    svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="text" type="text" placeholder="Find on this page" spellcheck="false" autocomplete="off" autofocus>
    <span id="count" class="count"></span>
    <button id="prev" title="Previous (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <button id="next" title="Next (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button id="close" title="Close (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'light') document.documentElement.classList.add('light');
    const text = document.getElementById('text'), count = document.getElementById('count');
    let asked = '';
    const fresh = () => { asked = text.value; window.findBar.query(asked, true, false); if (!asked) count.textContent = ''; };
    const step = forward => { if (!text.value) return; if (text.value !== asked) fresh(); else window.findBar.query(asked, forward, true); };
    text.addEventListener('input', fresh);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); window.findBar.close(); }
      else if (e.key === 'Enter' || e.key === 'F3') { e.preventDefault(); step(!e.shiftKey); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); text.select(); }
    });
    document.getElementById('prev').onclick = () => { step(false); text.focus(); };
    document.getElementById('next').onclick = () => { step(true); text.focus(); };
    document.getElementById('close').onclick = () => window.findBar.close();
    window.findBar.onResult(r => {
      if (!text.value) { count.textContent = ''; return; }
      count.textContent = r.of ? `${r.at} of ${r.of}` : 'No results';
      count.classList.toggle('none', !r.of);
    });
    window.findBar.onFocus(() => { text.focus(); text.select(); });
  </script>
</body>
</html>

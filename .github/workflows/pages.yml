# Publishes the website (xenon.justloofy.dev) from the files in site/.
# Nothing is built here: site/ arrives already built, pushed by the publishing tool of the private source.
# Needs, once, in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site

# It runs on every push. (A filter on site/** looked tidier, but GitHub only checks the first 300 changed files of a
# push against such a filter, so a large push could go unpublished.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

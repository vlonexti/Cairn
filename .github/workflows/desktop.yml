# Builds the desktop app for Windows, Linux and macOS and attaches the installers to a GitHub release.
#
# The app is only a window onto the website, so it does not need rebuilding when lessons or the site change.
# This runs when something under desktop/ changes, or when started by hand from the Actions tab.
name: Desktop app

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: xenon-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Read the version
        id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ steps.v.outputs.version }}
        run: |
          notes="Xenon for the desktop: the Xenon website in windows of its own. Same accounts, same progress, and it always shows the newest version of the site. It opens without a connection, has more than one window, find on the page, and saves pages as PDF.

          - Windows: Xenon-Setup-*.exe installs it; the portable .exe runs without installing.
          - macOS, no administrator needed: download the .zip (one file for every Mac, Apple chip or Intel), double-click it, and keep Xenon.app anywhere, such as the Desktop. The first time, open Terminal and run: xattr -dr com.apple.quarantine ~/Desktop/Xenon.app (change the path if you put it somewhere else). After that it opens with a double-click. The .dmg is the same app for people who would rather drag it into Applications.
          - Linux: the .AppImage runs anywhere (mark it executable first); the .deb installs on Debian and Ubuntu."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Xenon desktop ${TAG#desktop-v}" --notes "$notes"
          fi
